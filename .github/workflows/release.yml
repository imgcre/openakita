name: Release

on:
  workflow_dispatch:
    inputs:
      smoke_nonce:
        description: "Required guard for the temporary SignPath release-flow smoke test."
        required: true
        default: ""
      source_run_id:
        description: "Workflow run id that contains the unsigned Windows installer artifact."
        required: true
        default: "27742545923"
      source_artifact_id:
        description: "Unsigned Windows installer artifact id from source_run_id."
        required: true
        default: "7782659231"

jobs:
  signpath_release_flow_smoke:
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Check smoke guard
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ inputs.smoke_nonce }}" -ne "codex-signpath-smoke") {
            Write-Error "Wrong smoke_nonce; refusing to run temporary SignPath smoke test."
            exit 1
          }

      - name: Download previous unsigned installer artifact
        id: download_source_artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $outDir = Join-Path $env:RUNNER_TEMP "signpath-source-artifact"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $zipPath = Join-Path $env:RUNNER_TEMP "unsigned-installer-artifact.zip"

          gh api `
            "repos/${{ github.repository }}/actions/artifacts/$env:SOURCE_ARTIFACT_ID/zip" `
            --method GET `
            --output $zipPath

          Expand-Archive -LiteralPath $zipPath -DestinationPath $outDir -Force
          $installers = @(Get-ChildItem -LiteralPath $outDir -Filter "*.exe" -File -Recurse)
          if ($installers.Count -ne 1) {
            Write-Error "Expected exactly one exe in source artifact, found $($installers.Count)."
            $installers | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }

          $installer = $installers[0].FullName
          $unsigned = Get-AuthenticodeSignature -LiteralPath $installer
          Write-Host "Source installer: $installer"
          Write-Host "Source Authenticode status: $($unsigned.Status)"
          "installer=$installer" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned Windows installer for SignPath
        id: upload_unsigned_windows_installer
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-installer-smoke
          path: ${{ steps.download_source_artifact.outputs.installer }}
          if-no-files-found: error
          retention-days: 1
          archive: false

      - name: Verify SignPath release configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:SIGNPATH_API_TOKEN) {
            Write-Error "Missing SIGNPATH_API_TOKEN."
            exit 1
          }

          $organizationId = "fbb6fb8c-4af2-4876-903e-a4b878e40b84"
          $projectSlug = "openakita"
          $policySlug = "openakita-test-sign-policy"
          $artifactConfigurationSlug = "initial"
          $certificateSlug = "openakita-test-cert"
          $baseUrl = "https://app.signpath.io/api/v1/$organizationId"
          $headers = @{ Authorization = "Bearer $env:SIGNPATH_API_TOKEN" }

          function Test-SignPathEndpoint {
            param(
              [string] $Name,
              [string] $Uri
            )

            try {
              Invoke-RestMethod -Uri $Uri -Headers $headers -Method Get -ErrorAction Stop | Out-Null
              Write-Host "$Name is available."
            }
            catch {
              if ($_.Exception.Response) {
                $statusCode = [int]$_.Exception.Response.StatusCode
                Write-Error "$Name is not available (HTTP $statusCode): $Uri"
              } else {
                Write-Error "$Name is not available: $($_.Exception.Message)"
              }
              exit 1
            }
          }

          Test-SignPathEndpoint "SignPath project" "$baseUrl/Projects/$projectSlug"
          Test-SignPathEndpoint "SignPath signing policy" "$baseUrl/Projects/$projectSlug/SigningPolicies/$policySlug"
          Test-SignPathEndpoint "SignPath artifact configuration XML" "$baseUrl/Projects/$projectSlug/ArtifactConfigurations/$artifactConfigurationSlug/Xml"
          Test-SignPathEndpoint "SignPath certificate" "$baseUrl/Certificates/$certificateSlug"

      - name: Sign Windows installer with SignPath
        id: signpath_windows_installer
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: fbb6fb8c-4af2-4876-903e-a4b878e40b84
          project-slug: openakita
          signing-policy-slug: openakita-test-sign-policy
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.upload_unsigned_windows_installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: "1800"
          service-unavailable-timeout-in-seconds: "1800"
          output-artifact-directory: ${{ runner.temp }}/signpath-signed
          skip-decompress: true

      - name: Verify SignPath signed installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signedDir = Join-Path $env:RUNNER_TEMP "signpath-signed"
          $signedInstallers = @(Get-ChildItem -LiteralPath $signedDir -Filter "*.exe" -File -Recurse)
          if ($signedInstallers.Count -ne 1) {
            Write-Error "Expected exactly one signed installer in $signedDir, found $($signedInstallers.Count)."
            $signedInstallers | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }

          $signedInstaller = $signedInstallers[0].FullName
          $authenticode = Get-AuthenticodeSignature -LiteralPath $signedInstaller
          if ($authenticode.Status -eq "NotSigned") {
            Write-Error "SignPath output is not Authenticode-signed: $signedInstaller"
            exit 1
          }

          Write-Host "SignPath signing request: ${{ steps.signpath_windows_installer.outputs.signing-request-web-url }}"
          Write-Host "Signed installer: $signedInstaller"
          Write-Host "Authenticode status: $($authenticode.Status)"
          if ($authenticode.SignerCertificate) {
            Write-Host "Signer subject: $($authenticode.SignerCertificate.Subject)"
          }
